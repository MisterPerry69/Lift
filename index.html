<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d0f12" />
    <title>Lift</title>
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/home.css" />
    <link rel="stylesheet" href="css/editor.css" />
    <link rel="stylesheet" href="css/exec.css" />
    <link rel="stylesheet" href="css/finish.css" />
    <link rel="stylesheet" href="css/profile.css" />
    <link rel="stylesheet" href="css/history.css" />
    <link rel="stylesheet" href="css/stats.css" />
  </head>
  <body>
    <div class="app">
      <!-- HOME -->
      <main id="screen-home" class="screen active">
        <header class="home-header">
          <div>
            <h1 id="home-greeting" class="home-greeting">…</h1>
            <div id="home-streak" class="home-streak"></div>
          </div>
          <button id="avatar-btn" class="avatar-btn" aria-label="Profilo"></button>
        </header>

        <div id="week-bar" class="week-bar"></div>

        <section id="hero-card" class="hero-card"></section>

        <div class="section-label label-micro">Altre schede</div>
        <ul id="template-list" class="template-list"></ul>
        <button id="home-new-template" class="add-block-btn">+ Nuova scheda</button>
      </main>

      <!-- EDITOR SCHEDE -->
      <main id="screen-editor" class="screen"></main>

      <!-- ESECUZIONE -->
      <main id="screen-exec" class="screen"></main>

      <!-- FINE SESSIONE -->
      <main id="screen-finish" class="screen"></main>

      <!-- PROFILO (menu globale) -->
      <main id="screen-profile" class="screen"></main>

      <!-- STORICO -->
      <main id="screen-history" class="screen"></main>

      <!-- DETTAGLIO SESSIONE -->
      <main id="screen-session-detail" class="screen"></main>

      <!-- STATISTICHE -->
      <main id="screen-stats" class="screen"></main>
    </div>

    <script src="js/icons.js"></script>
    <script src="js/exercises-db.js"></script>
    <script src="js/mockData.js"></script>
    <script src="js/api.js"></script>
    <script src="js/home.js"></script>
    <script src="js/editor.js"></script>
    <script src="js/exec.js"></script>
    <script src="js/finish.js"></script>
    <script src="js/profile.js"></script>
    <script src="js/history.js"></script>
    <script src="js/stats.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
